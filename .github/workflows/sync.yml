name: Sync stock y ventas

on:
  schedule:
    - cron: "15 */2 * * *"
    - cron: "45 10 * * 1-6"
  workflow_dispatch:
    inputs:
      enviar_alertas:
        description: "Enviar digest de alertas"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-reposicion
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-extractor.txt

      - name: Bajar datos previos
        run: |
          git clone --depth 1 --branch data "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data \
            || mkdir -p data
          rm -rf data/.git

      - name: Extraer de Shopify
        env:
          TOKEN_REEBOK: ${{ secrets.TOKEN_REEBOK }}
          TOKEN_COLUMBIA: ${{ secrets.TOKEN_COLUMBIA }}
          TOKEN_CROCS: ${{ secrets.TOKEN_CROCS }}
          TOKEN_KAPPA: ${{ secrets.TOKEN_KAPPA }}
          TOKEN_PICCADILLY: ${{ secrets.TOKEN_PICCADILLY }}
        run: python extractor.py

      - name: Publicar datos
        run: |
          cd data
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      - name: Digest de alertas
        if: github.event.schedule == '45 10 * * 1-6' || inputs.enviar_alertas
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERTAS_DESTINO: ${{ secrets.ALERTAS_DESTINO }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python alertas.py
